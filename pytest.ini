[pytest]
# pytest 配置文件

# 測試文件搜尋模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 測試目錄
testpaths = tests

# 輸出選項
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# 標記定義
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 執行時間較長的測試
    requires_network: 需要網路連接的測試

# 覆蓋率排除
[coverage:run]
omit = 
    tests/*
    */venv/*
    */virtualenv/*
    setup.py
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: