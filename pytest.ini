[pytest]
# pytest 配置文件
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 覆蓋率設定
addopts = 
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=10
    -v
    --tb=short

# 忽略的目錄
norecursedirs = .git venv env dist build *.egg .tox htmlcov R app docs output

# 覆蓋率忽略的檔案
[coverage:run]
omit = 
    */tests/*
    */venv/*
    */env/*
    setup.py
    */site-packages/*
    app.R
    app_simple.R
    quick_start.R