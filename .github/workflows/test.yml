name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtirpc-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-timeout
        # Install core dependencies
        pip install numpy pandas scipy matplotlib skyfield sgp4 requests beautifulsoup4 tqdm python-dateutil
        # Install optional ML dependencies with error handling
        pip install scikit-learn || echo "scikit-learn installation failed"
    
    - name: Run tests
      run: |
        # 執行基本測試
        python -m pytest tests/test_basic_ci.py -v
        # 執行所有測試（排除慢速測試）
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --timeout=300 -m "not slow"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Lint with flake8
      run: |
        # 只檢查主要的 Python 檔案（排除 scripts 等目錄）
        flake8 satellite_analysis.py starlink.py simple_analysis.py app/ tests/ --config=.flake8
    
    - name: Check formatting with black
      run: |
        # 只檢查主要的 Python 檔案
        black --check --diff satellite_analysis.py starlink.py simple_analysis.py app/ tests/
    
    - name: Check import ordering with isort
      run: |
        # 只檢查主要的 Python 檔案
        isort --check-only --diff satellite_analysis.py starlink.py simple_analysis.py app/ tests/