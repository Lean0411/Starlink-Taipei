[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlink-taipei"
version = "2.1.0"
description = "Starlink satellite coverage analysis and prediction system for Taipei"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Starlink Taipei Analysis Team", email = "admin@example.com"}
]
keywords = ["satellite", "starlink", "coverage", "analysis", "taipei"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # 基礎計算和數據處理
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0.0,<3.0",
    "scipy>=1.11.0,<2.0",
    
    # 天體計算和軌道分析
    "skyfield>=1.46,<2.0",
    "sgp4>=2.21,<3.0",
    
    # 可視化
    "matplotlib>=3.7.0,<4.0",
    "plotly>=5.17.0,<6.0",
    "kaleido>=0.2.1,<1.0",
    
    # Web API 框架
    "fastapi>=0.104.0,<1.0",
    "uvicorn[standard]>=0.24.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    
    # 網頁應用框架
    "shiny>=0.6.0,<1.0",
    
    # 深度學習和機器學習
    "torch>=2.0.0,<3.0",
    "scikit-learn>=1.3.0,<2.0",
    
    # 時間序列分析
    "statsmodels>=0.14.0,<1.0",
    
    # 數據格式處理
    "requests>=2.31.0,<3.0",
    "beautifulsoup4>=4.12.0,<5.0",
    
    # 系統和工具
    "tqdm>=4.65.0,<5.0",
    "python-dateutil>=2.8.0,<3.0",
    "structlog>=23.0.0,<24.0",
    "python-json-logger>=2.0.0,<3.0",
    
    # 依賴注入
    "punq>=0.6.0,<1.0",
    
    # 快取
    "redis[hiredis]>=4.5.0,<5.0",
]

[project.optional-dependencies]
r-integration = [
    "rpy2>=3.5.0,<4.0",
]

dev = [
    # 測試
    "pytest>=7.4.0,<8.0",
    "pytest-cov>=4.1.0,<5.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "pytest-timeout>=2.1.0,<3.0",
    
    # 代碼品質
    "black>=23.0.0,<24.0",
    "isort>=5.12.0,<6.0",
    "flake8>=6.0.0,<7.0",
    "mypy>=1.5.0,<2.0",
    
    # 文檔
    "sphinx>=7.0.0,<8.0",
    "sphinx-rtd-theme>=1.3.0,<2.0",
]

all = [
    "starlink-taipei[r-integration,dev]",
]

[project.urls]
"Homepage" = "https://github.com/Lean0411/Starlink-Taipei"
"Bug Tracker" = "https://github.com/Lean0411/Starlink-Taipei/issues"
"Documentation" = "https://github.com/Lean0411/Starlink-Taipei#readme"

[project.scripts]
starlink-api = "src.interfaces.api.app:main"
starlink-shiny = "src.interfaces.shiny.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]
exclude = ["legacy*", "scripts*", "data*", "output*"]

[tool.setuptools.package-data]
"src" = ["**/*.yaml", "**/*.yml", "**/*.json"]

[tool.black]
line-length = 127
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
  | scripts
  | data
  | output
  | models
  | logs
  | legacy
)/
'''

[tool.isort]
profile = "black"
line_length = 127
skip = [
    ".git",
    "__pycache__",
    ".venv",
    "venv", 
    "env",
    "htmlcov",
    "build",
    "dist",
    ".pytest_cache",
    "scripts",
    "data",
    "output",
    "models",
    "logs",
    "legacy"
]
skip_glob = ["*/migrations/*", "*/settings/*"]
known_third_party = ["numpy", "pandas", "matplotlib", "skyfield", "torch", "sklearn", "fastapi", "pydantic", "pytest"]
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/legacy/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true