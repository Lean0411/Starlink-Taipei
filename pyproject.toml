[tool.black]
line-length = 127
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
  | scripts
  | data
  | output
  | models
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 127
skip = [
    ".git",
    "__pycache__",
    ".venv",
    "venv", 
    "env",
    "htmlcov",
    "build",
    "dist",
    ".pytest_cache",
    "scripts",
    "data",
    "output",
    "models",
    "logs"
]
skip_glob = ["*/migrations/*", "*/settings/*"]
known_third_party = ["numpy", "pandas", "matplotlib", "skyfield", "torch", "sklearn"]
known_first_party = ["app", "satellite_analysis", "starlink", "simple_analysis"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true